description: >-
  McGill University is a public research university in Montreal, Quebec, Canada, and one of
  Canada's two U15 institutions in the global top 100. Its programmable footprint is small and
  must be described honestly: McGill operates no developer portal, publishes no API key
  programme, and runs no OAuth authorization server. Exactly one machine-readable surface is
  operated by the institution itself — the Shibboleth SAML 2.0 identity provider at
  shibboleth.mcgill.ca, whose federation metadata is served unauthenticated at /idp/shibboleth
  and carries entityID and shibmd:Scope of mcgill.ca. Everything else that looks like a McGill
  API is a platform McGill is a tenant on: eScholarship@McGill runs on Scholaris (Scholars
  Portal / OCUL DSpace 7) at mcgill.scholaris.ca, which serves a DSpace REST root and a valid
  OAI-PMH 2.0 endpoint; the McGill University Dataverse is a collection on Borealis
  (borealisdata.ca), a consortial host shared with five other institutions in this catalog; the
  course catalogue at coursecatalogue.mcgill.ca is a CourseLeaf instance CNAMEd to
  mcgill-ca-public.courseleaf.com. Those relationships are real institutional facts and are
  recorded as tenant surfaces — the data is McGill's, the contracts are not. Registration,
  library discovery and HR run on Banner/Minerva, WorldCat and Workday behind authentication
  with no public interface.
