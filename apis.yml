    shape as a repository CNAMEd to a hosted DSpace.
  description: >-
    McGill's official course catalogue, published on CourseLeaf. It carries an undocumented but
    live machine-readable course-detail endpoint — GET /ribbit/index.cgi?page=getcourse.rjs with
    a space-separated course code returns XML with a CDATA course block (verified 200,
    text/xml, for COMP 202 and BIOL 112 on 2026-08-30; an unknown code returns an empty
    courseinfo element, also 200). No contract is saved: the endpoint is CourseLeaf's product
    surface, identical across every CourseLeaf customer, and saving it under McGill would credit
    the institution with a vendor's design. Recorded because the catalogue data is McGill's and
    a course catalogue is one of the surface classes a university genuinely operates.
