- aid: mcgill:escholarship-scholaris
  name: eScholarship@McGill on Scholaris (tenant)
  x-operator: tenant
  x-operator-evidence: >-
    mcgill.scholaris.ca is an institution-specific subdomain on the Scholaris platform (Scholars
    Portal / OCUL) and resolves via public-proxy.scholaris.ca. escholarship.mcgill.ca, McGill's
    own hostname, CNAMEs to nproxy.scholarsportal.info and redirects here. The OAI-PMH Identify
    response names the repository "eScholarship@McGill" with adminEmail
    escholarship.library@mcgill.ca — McGill's content and McGill's contact on a consortial
    DSpace 7 deployment McGill does not engineer.
  description: >-
    McGill's institutional research repository, running as a tenant on Scholaris. It exposes a
    DSpace REST (HAL) root at /server/api and a conformant OAI-PMH 2.0 endpoint at
    /server/oai/request advertising thirteen metadata prefixes (oai_dc, qdc, mods, mets, didl,
    ore, xoai, dim, rdf, marc, etdms, rioxx, uketd_dc). No contract is saved under McGill: the
    DSpace REST and OAI-PMH interfaces are the platform's and belong to DSpace, not to this
    institution. Recorded because the repository, its records and its DOIs are genuinely
    McGill's — this is one of the few programmable surfaces the university actually has.
