- aid: mcgill:shibboleth-idp
  name: McGill University Authentication Service — Shibboleth SAML 2.0 Identity Provider
  x-operator: institution
  x-operator-evidence: >-
    shibboleth.mcgill.ca is under McGill's own registrable domain and resolves to 132.216.98.81
