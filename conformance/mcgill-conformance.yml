description: >-
  Domain-standard conformance for McGill University against the Kin Score `education`
  regulatory regime. Three of the regime's named standards are evidenced by live response
  bodies. Each entry records the operator of the surface that satisfies it, because two of
  the three are satisfied by a platform McGill is a tenant on rather than by McGill's own
  engineering, and crediting those to the institution without saying so is the failure mode
  this profile exists to avoid.
