- standard: oai-pmh
  status: conformant
  operator: tenant
  surface: eScholarship@McGill (Scholaris / DSpace)
  version: '2.0'
  evidence:
    url: https://mcgill.scholaris.ca/server/oai/request?verb=Identify
    status: 200
    content_type: text/xml;charset=UTF-8
    observed: '2026-08-30'
    locator: >-
      OAI-PMH Identify response — repositoryName "eScholarship@McGill",
      baseURL https://mcgill.scholaris.ca/server/oai/request, protocolVersion 2.0,
      adminEmail escholarship.library@mcgill.ca, repositoryIdentifier mcgill.scholaris.ca.
    detail: >-
      ListMetadataFormats returns 13 prefixes: oai_dc, qdc, mods, mets, didl, ore, xoai, dim,
